window_rule=tags:5,app_id:org.telegram.desktop
window_rule=tags:6,app_id:TrueConf
window_rule=tags:7,is_floating:1,app_id:wlroots
window_rule=tags:8,app_id:YandexMusic
window_rule=tags:9,is_floating:1,app_id:AmneziaVPN
window_rule=is_floating:1,app_id:7zFM
window_rule=is_floating:1,title:Library,app_id:librewolf,width:1200,height:600
window_rule=is_floating:1,title:Media viewer,app_id:org.telegram.desktop
window_rule=is_floating:1,title:Article,app_id:org.telegram.desktop
window_rule=is_floating:1,title:TrueConf,app_id:TrueConf
