# https://mangowm.github.io/docs/window-management

# monitors
monitor_rule=name:DP-2,width:3840,height:2160,refresh:160,x:0,y:0,scale:2,vrr:1
monitor_rule=name:eDP-1,width:3072,height:1920,refresh:120,x:192,y:1080,scale:2,vrr:1

# workspaces
tag_rule=id:1,layout_name:scroller
tag_rule=id:2,layout_name:scroller
tag_rule=id:3,layout_name:scroller
tag_rule=id:4,layout_name:scroller
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:scroller
tag_rule=id:8,layout_name:scroller
tag_rule=id:9,layout_name:scroller

# scroller configuration
scroller_default_proportion=0.5
scroller_ignore_proportion_single=0

# window rules
window_rule=tags:1,app_id:footclient
window_rule=tags:2,app_id:librewolf
window_rule=tags:3,app_id:codium
window_rule=tags:4,app_id:org.gnome.Nautilus
window_rule=tags:5,app_id:org.telegram.desktop
window_rule=tags:6,app_id:TrueConf
window_rule=tags:7,is_floating:1,app_id:wlroots
window_rule=tags:7,app_id:org.remmina.Remmina
window_rule=tags:8,app_id:YandexMusic
window_rule=tags:9,is_floating:1,app_id:AmneziaVPN
window_rule=is_floating:1,app_id:7zFM
window_rule=is_floating:1,title:^(File Upload|Open File),app_id:^xdg-desktop-portal-gtk$,width:1200,height:700
window_rule=is_floating:1,title:Media viewer,app_id:org.telegram.desktop
window_rule=is_floating:1,title:Article,app_id:org.telegram.desktop
window_rule=is_floating:1,title:TrueConf,app_id:TrueConf
