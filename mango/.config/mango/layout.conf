# https://mangowm.github.io/docs/window-management

# workspaces
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# scroller configuration
scroller_default_proportion=0.5
scroller_ignore_proportion_single=0

# window rules
windowrule=tags:1,appid:footclient
windowrule=tags:2,appid:librewolf
windowrule=tags:3,appid:codium
windowrule=tags:4,appid:org.gnome.Nautilus
windowrule=tags:5,appid:org.telegram.desktop
windowrule=tags:6,appid:TrueConf
windowrule=tags:7,isfloating:1,appid:wlroots
windowrule=tags:8,appid:YandexMusic
windowrule=tags:9,isfloating:1,appid:AmneziaVPN
windowrule=isfloating:1,appid:7zFM
windowrule=isfloating:1,title:Library,appid:librewolf,width:1200,height:600
windowrule=isfloating:1,title:Media viewer,appid:org.telegram.desktop
windowrule=isfloating:1,title:Article,appid:org.telegram.desktop
windowrule=isfloating:1,title:TrueConf,appid:TrueConf
